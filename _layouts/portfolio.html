---
layout: default
---

<!DOCTYPE HTML>
<!--
  Portfolio layout (styled like Blog Post)
  Based on Strata by HTML5 UP
  Modified for BrockAkerman.github.io
-->
<html lang="en">
  <head>
    <title>{{ page.title | escape }}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
  </head>

  <!-- ✅ Body class triggers your portfolio side margins -->
  <body class="{% if page.url == '/portfolio/' %}portfolio{% endif %}">
    {% include burger_menu.html %}

    <!-- =========================
         Main Content
    ========================== -->
    <main>

      <!-- === Portfolio Gallery (wide, no border) === -->
      <section class="portfolio-gallery">
        <header class="post-header">
          <h1 class="post-title">{{ page.title }}</h1>
          {% if page.date %}
          <p class="post-meta">
            <time datetime="{{ page.date | date_to_xmlschema }}">
              {{ page.date | date: "%B %d, %Y" }}
            </time>
          </p>
          {% endif %}
        </header>

        <div class="portfolio-grid">
          <!-- ✳️ Add your gallery tiles here -->
          {{ content }}
        </div>
      </section>

      <!-- === Academic Featured (soft bordered box) === -->
      <section class="portfolio-featured">
        <header>
          <h2>Academic Featured</h2>
        </header>
        <div class="portfolio-grid">
          <!-- ✳️ Add your academic feature tiles here -->
          <!-- Example tile structure -->
          <!--
          <div class="portfolio-tile">
            <img src="/assets/media/project1.jpg" alt="Project image">
            <h3>Statistical Research Project</h3>
            <p>Developed mixed-effects model to analyze survey responses across institutions.</p>
          </div>
          -->
        </div>
      </section>

      <!-- === (Optional) Future Feature Sections === -->
      <!--
      <section class="portfolio-featured">
        <header>
          <h2>Industry Work</h2>
        </header>
        <div class="portfolio-grid">
          <!-- Future tiles go here -->
        </div>
      </section>
      -->

    </main>

    <!-- =========================
         Scripts
    ========================== -->
    <script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/jquery.poptrox.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/skel.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/util.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script>
      document.getElementById('menu-toggle').addEventListener('click', function () {
        const menuItems = document.getElementById('menu-items');
        menuItems.classList.toggle('visible');
      });
    </script>
  </body>
</html>
